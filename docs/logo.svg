<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d9be9"/>
      <stop offset="1" stop-color="#1d6fc4"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b2a4a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="pageClip"><rect x="96" y="112" width="320" height="300" rx="36"/></clipPath>
  </defs>
  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- Calendar page -->
  <g filter="url(#shadow)">
    <rect x="96" y="112" width="320" height="300" rx="36" fill="url(#page)"/>
  </g>
  <g clip-path="url(#pageClip)">
    <rect x="96" y="112" width="320" height="72" fill="#e94b3c"/>
  </g>
  <!-- Binder rings -->
  <rect x="164" y="88" width="24" height="56" rx="12" fill="#f4f7fb"/>
  <rect x="324" y="88" width="24" height="56" rx="12" fill="#f4f7fb"/>
  <!-- Event bars (bar look: color bar + tint) -->
  <rect x="128" y="212" width="256" height="40" rx="10" fill="#c7d9f8"/>
  <rect x="128" y="212" width="12" height="40" rx="5" fill="#3d7be0"/>
  <rect x="152" y="227" width="120" height="10" rx="5" fill="#3d7be0" opacity="0.55"/>
  <rect x="128" y="266" width="256" height="40" rx="10" fill="#cdebd8"/>
  <rect x="128" y="266" width="12" height="40" rx="5" fill="#2fa865"/>
  <rect x="152" y="281" width="90" height="10" rx="5" fill="#2fa865" opacity="0.55"/>
  <!-- Task row: check + line -->
  <rect x="128" y="328" width="40" height="40" rx="10" fill="#3d9be9"/>
  <path d="M138 348 l9 9 l15 -18" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="182" y="343" width="150" height="10" rx="5" fill="#9aa6b5"/>
  <!-- Sun badge (weather): on a white disc, apart from the page -->
  <g transform="translate(398 114)" filter="url(#shadow)">
    <circle r="58" fill="#ffffff"/>
    <circle r="27" fill="#ffb627"/>
    <g stroke="#ffb627" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-38" x2="0" y2="-46"/><line x1="0" y1="38" x2="0" y2="46"/>
      <line x1="-38" y1="0" x2="-46" y2="0"/><line x1="38" y1="0" x2="46" y2="0"/>
      <line x1="27" y1="27" x2="32" y2="32"/><line x1="-27" y1="-27" x2="-32" y2="-32"/>
      <line x1="27" y1="-27" x2="32" y2="-32"/><line x1="-27" y1="27" x2="-32" y2="32"/>
    </g>
  </g>
</svg>
